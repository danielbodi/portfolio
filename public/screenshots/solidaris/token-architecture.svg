<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0F172A"/>
  <text x="640" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#A78BFA" font-weight="700">3-tier token architecture with a PrimeNG bridge</text>
  <rect x="140" y="140" width="1000" height="110" rx="14" fill="#1E293B" stroke="#334155"/>
  <text x="180" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#E2E8F0" font-weight="600">1 &#8212; Primitive &#183; what the value is</text>
  <text x="180" y="222" font-family="Consolas, monospace" font-size="19" fill="#7DD3FC">--pds-color-primary-500: #527191;</text>
  <line x1="640" y1="250" x2="640" y2="290" stroke="#7C3AED" stroke-width="2"/>
  <rect x="140" y="290" width="1000" height="110" rx="14" fill="#1E293B" stroke="#334155"/>
  <text x="180" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#E2E8F0" font-weight="600">2 &#8212; Semantic &#183; what the value means</text>
  <text x="180" y="372" font-family="Consolas, monospace" font-size="19" fill="#7DD3FC">--pds-color-brand: var(--pds-color-primary-500);</text>
  <line x1="640" y1="400" x2="640" y2="440" stroke="#7C3AED" stroke-width="2"/>
  <rect x="140" y="440" width="1000" height="110" rx="14" fill="#312E81" stroke="#7C3AED" stroke-width="2"/>
  <text x="180" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#E2E8F0" font-weight="600">3 &#8212; Component / vendor bridge &#183; where it is applied</text>
  <text x="180" y="522" font-family="Consolas, monospace" font-size="19" fill="#C7D2FE">--p-button-primary-background: var(--pds-color-brand);</text>
  <text x="640" y="615" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#94A3B8">170+ Figma variables mapped 1:1 &#183; single-prefix rebranding &#183; components never touch primitives</text>
  <text x="640" y="680" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748B">Schematic &#8212; structure recreated for confidentiality</text>
</svg>
